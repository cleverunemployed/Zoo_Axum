version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: animal-api-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/animal_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - animal-network

  db:
    image: postgres:15-alpine
    container_name: animal-api-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=animal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animal_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - animal-network

volumes:
  postgres_data:
    name: animal-api-postgres-data

networks:
  animal-network:
    name: animal-api-network
    driver: bridge